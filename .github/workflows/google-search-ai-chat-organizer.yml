name: Validate Google Search AI Chat Organizer

on:
  pull_request:
    branches:
      - main
    paths:
      - "Google-Search-AI-Chat-Organizer/**"
      - ".github/workflows/google-search-ai-chat-organizer.yml"
  push:
    paths:
      - "Google-Search-AI-Chat-Organizer/**"
      - ".github/workflows/google-search-ai-chat-organizer.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension and smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Google-Search-AI-Chat-Organizer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Manifest V3
        run: |
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (manifest.manifest_version !== 3) {
              throw new Error("Expected manifest_version: 3");
            }
            const versionParts = (manifest.version || "").split(".");
            if (versionParts.length !== 3 || versionParts.some((part) => !/^[0-9]+$/.test(part))) {
              throw new Error("Manifest version must use MAJOR.MINOR.PATCH format");
            }
            for (const scriptGroup of manifest.content_scripts || []) {
              for (const file of scriptGroup.js || []) {
                if (!fs.existsSync(file)) {
                  throw new Error("Content script not found: " + file);
                }
              }
            }
            console.log("Manifest is valid; referenced content scripts exist.");
          '

      - name: Check JavaScript syntax
        run: node --check content.js

      - name: Install test dependencies
        run: npm install --no-package-lock

      - name: Run DOM smoke tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run extension browser smoke tests
        run: xvfb-run -a npm run test:browser
