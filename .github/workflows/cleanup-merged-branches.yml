name: Cleanup merged feature branches

on:
  pull_request:
    types: [closed]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete branches whose PRs are merged
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });

            const openHeads = new Set(
              pulls
                .filter((pr) => pr.state === "open" && pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref)
            );

            const mergedHeads = [...new Set(
              pulls
                .filter((pr) => pr.merged_at && pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref)
            )];

            for (const branch of mergedHeads) {
              if (branch === defaultBranch || openHeads.has(branch)) {
                core.info(`Keeping ${branch}: default branch or used by an open PR.`);
                continue;
              }

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted merged branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent or not deletable: ${branch}`);
                } else {
                  throw error;
                }
              }
            }
