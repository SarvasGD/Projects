name: HDMS CI

on:
  push:
    paths:
      - "HDMS/hdms-mvp/**"
      - ".github/workflows/hdms-ci.yml"
  pull_request:
    paths:
      - "HDMS/hdms-mvp/**"
      - ".github/workflows/hdms-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: HDMS/hdms-mvp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: HDMS/hdms-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run all checks
        run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1
