<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Jumble Toolkit v15 – Точный автофикс prefilled по final</title>
<style>
:root{--bg:#fff;--text:#000;--accent:#1e3a8a;--border:#000;--ok:#166534;--err:#991b1b;--warn:#92400e;--light:#f3f4f6}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:2rem;max-width:1400px;margin:0 auto}
h1{font-size:1.75rem;border-bottom:2px solid var(--border);padding-bottom:.5rem}
.zone{border:2px dashed var(--border);border-radius:4px;padding:3rem;text-align:center;cursor:pointer;margin-bottom:1.5rem}
.zone.dragover{background:var(--light)}
.btn{background:var(--accent);color:#fff;border:none;padding:.6rem 1.2rem;font-weight:600;cursor:pointer;border-radius:3px;margin-right:.5rem;margin-bottom:.5rem}
.summary{display:flex;gap:1.5rem;margin:1rem 0;font-weight:600;flex-wrap:wrap}
.stat{padding:.75rem 1.5rem;border:1px solid var(--border);border-radius:4px}
.stat.pass{border-left:4px solid var(--ok)}.stat.fail{border-left:4px solid var(--err)}
.card{border:1px solid var(--border);margin-bottom:1rem;border-radius:4px;overflow:hidden}
.card.pass{border-left:4px solid var(--ok)}.card.fail{border-left:4px solid var(--err)}
.cardhead{padding:.5rem 1rem;background:var(--light);font-weight:600;display:flex;justify-content:space-between}
.badge{font-size:.8rem;padding:.2rem .6rem;border-radius:3px}.badge.pass{background:#dcfce7;color:var(--ok)}.badge.fail{background:#fce4ec;color:var(--err)}
.cardbody{padding:1rem}
ul.errs{list-style:none;padding:0}ul.errs li{background:#fff5f5;border:1px solid #fecaca;padding:.5rem;margin-bottom:.25rem;font-family:monospace;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:.85rem}
th,td{border:1px solid var(--border);padding:.3rem .5rem;text-align:left}th{background:var(--light)}
.old-obv{text-decoration:line-through;color:var(--err);margin-right:.5rem}
.fix-suggest{color:var(--accent);font-weight:bold}
.old-prefilled{text-decoration:line-through;color:var(--err)}
.new-prefilled{color:var(--accent);font-weight:bold}
</style>
</head>
<body>
<h1>🧩 Jumble Toolkit v15 – Точный автофикс prefilled (по final)</h1>
<div id="dropZone" class="zone">📁 Перетащите JSON-файл сюда или кликните для выбора</div>
<input type="file" id="fileInput" accept=".json" hidden>
<div id="results"></div>
<script>
(function(){
const dz=document.getElementById('dropZone'), fi=document.getElementById('fileInput'), res=document.getElementById('results');
let lastData=null, lastResults=null, lastText=null, lastFname='levels';

dz.addEventListener('click',()=>fi.click());
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0])});
fi.addEventListener('change',e=>{if(e.target.files.length)loadFile(e.target.files[0])});

function loadFile(f){if(!f.name.endsWith('.json')){alert('Нужен .json');return}const r=new FileReader();r.onload=e=>{let raw=e.target.result,warns=[];try{JSON.parse(raw)}catch(e1){raw=raw.replace(/(?<!\\)"(?=(?:[^"]*"[^"]*")*[^"]*$)/g,"'");warns=['⚠️ Автоисправлены кавычки.']}try{const data=JSON.parse(raw);lastText=raw;lastFname=f.name.replace('.json','');process(data,f.name,warns)}catch(e2){res.innerHTML='<p style="color:var(--err)">Ошибка парсинга JSON.</p>'}};r.readAsText(f)}

const safeExtract=(w,obv)=>{let r=[];for(let i of obv){if(i<1||i>w.length)return null;r.push(w[i-1])}return r.join('')};
const cntStar=s=>(s.match(/\*/g)||[]).length;
const lfreq=s=>{let f={};for(let c of s)if(/[A-Za-z]/.test(c)){c=c.toUpperCase();f[c]=(f[c]||0)+1}return f};
const subF=(a,b)=>{let r={};for(let k in a)r[k]=a[k];for(let k in b){r[k]=(r[k]||0)-b[k];if(r[k]<0)return null;if(r[k]===0)delete r[k]}return r};
const f2s=f=>Object.keys(f).sort().map(k=>k.repeat(f[k])).join('');
const isLetter=c=>/[A-Za-z]/.test(c);

const MIN_OBV=2, MAX_OBV=3;

function findLetterPositions(word, letter, currentObv) {
    const positions = [];
    const upperWord = word.toUpperCase();
    const upperLetter = letter.toUpperCase();
    for (let i=0; i<upperWord.length; i++) {
        if (upperWord[i] === upperLetter && !currentObv.includes(i+1)) {
            positions.push(i+1);
        }
    }
    return positions;
}

function autoFixObv(words, neededFreq) {
    const remainingNeeded = { ...neededFreq };
    const wordAssignments = words.map(() => []);

    for (let k in remainingNeeded) {
        let need = remainingNeeded[k];
        while (need > 0) {
            let bestWord = -1, bestPos = -1;
            for (let wi = 0; wi < words.length; wi++) {
                if (wordAssignments[wi].length >= MAX_OBV) continue;
                const positions = findLetterPositions(words[wi].word, k, wordAssignments[wi]);
                if (positions.length > 0) {
                    bestWord = wi;
                    bestPos = positions[0];
                    break;
                }
            }
            if (bestWord >= 0) {
                wordAssignments[bestWord].push(bestPos);
                need--;
            } else {
                break;
            }
        }
    }

    for (let wi = 0; wi < words.length; wi++) {
        while (wordAssignments[wi].length < MIN_OBV && wordAssignments[wi].length < words[wi].word.length) {
            const upperWord = words[wi].word.toUpperCase();
            for (let i = 0; i < upperWord.length; i++) {
                if (!wordAssignments[wi].includes(i + 1)) {
                    wordAssignments[wi].push(i + 1);
                    break;
                }
            }
        }
        wordAssignments[wi].sort((a, b) => a - b);
    }

    return words.map((w, idx) => ({
        word: w.word,
        obv: [...(w.obv || [])],
        idx,
        suggestedObv: [...wordAssignments[idx]],
        extraIndices: [],
        missingToAdd: [],
        extracted: safeExtract(w.word, w.obv || []) || '',
        lettersOk: true
    }));
}

function fixPrefilledByFinal(prefilled, final) {
    // Исправляет prefilled, чтобы количество звёздочек соответствовало буквам в final
    let result = '';
    let i = 0, j = 0;
    while (i < prefilled.length) {
        if (prefilled[i] !== '*') {
            // Не-звёздочка: проверяем совпадение с final (если возможно)
            if (j < final.length && prefilled[i] === final[j]) {
                result += prefilled[i];
                i++; j++;
            } else if (j < final.length && isLetter(final[j]) && prefilled[i] !== final[j]) {
                // Несовпадение: возможно, ошибка в prefilled, пропускаем?
                result += prefilled[i];
                i++;
                // j не двигаем, так как буква в final не совпала с prefilled
            } else {
                result += prefilled[i];
                i++;
                if (j < final.length && !isLetter(final[j])) j++;
            }
        } else {
            // Группа звёздочек: считаем длину группы в prefilled
            let starLen = 0;
            while (i < prefilled.length && prefilled[i] === '*') { starLen++; i++; }
            // Считаем длину соответствующей группы букв в final
            let letterLen = 0;
            while (j < final.length && isLetter(final[j])) { letterLen++; j++; }
            // Заменяем на правильное количество звёздочек
            result += '*'.repeat(letterLen);
        }
    }
    // Добавляем оставшиеся буквы final, если они есть (не должно быть, но на всякий случай)
    if (j < final.length && isLetter(final[j])) {
        result += '*'.repeat(final.length - j); // грубо, но для подстраховки
    }
    return result;
}

function validate(lvl){
  let e=[], lv=lvl.level??'?', pf=lvl.prefilled||'', fn=lvl.final||'', ws=lvl.words||[];
  let sc=cntStar(pf), to=ws.reduce((s,w)=>s+(w.obv||[]).length,0);
  let fixedPrefilled = pf;
  let starFixed = false;
  
  if(sc!==to){
    if(sc > to){
      fixedPrefilled = fixPrefilledByFinal(pf, fn);
      starFixed = true;
      e.push(`⚠️ Шаг 1: звёздочек ${sc}, obv ${to}. prefilled исправлен по final.`);
      sc = cntStar(fixedPrefilled);
      // Проверяем, что исправление дало правильное количество
      if (sc !== to) {
        e.push(`⚠️ Не удалось точно исправить prefilled (звёздочек стало ${sc}, нужно ${to}). Проверьте вручную.`);
        fixedPrefilled = pf; // откатываем
        starFixed = false;
        sc = cntStar(pf);
      }
    } else {
      e.push(`⚠️ Шаг 1: звёздочек ${sc}, obv ${to}. Лишние индексы в obv (автофикс не меняет prefilled в этом случае).`);
    }
  }

  let wds=[], parts=[];
  for(let i=0;i<ws.length;i++){
    let w=ws[i], word=w.word||'', obv=w.obv||[];
    let part='', err=null;
    part=safeExtract(word,obv)||'';
    if(safeExtract(word,obv)===null) err='Индекс вне границ';
    if(err) e.push(`❌ Слово ${i} ('${word}'): ${err}`);
    parts.push(part);
    wds.push({word,obv:[...obv],extracted:part,err,lettersOk:true,suggestedObv:[...obv]});
  }
  let extr=parts.join(''), preL=fixedPrefilled.replace(/\*/g,''), nf=subF(lfreq(fn),lfreq(preL));
  if(!nf) e.push(`❌ Шаг 2a: В prefilled есть буквы, которых нет в final.`);
  else{
    let nl=f2s(nf), el=f2s(lfreq(extr));
    if(nl!==el){
      let xf={},mf={};
      let ef=lfreq(extr);
      for(let k in ef){let d=ef[k]-(nf[k]||0);if(d>0)xf[k]=d}
      for(let k in nf){let d=nf[k]-(ef[k]||0);if(d>0)mf[k]=d}
      e.push(`❌ Шаг 2b (Анаграмма): не совпадает.`);
      e.push(`   Ожидалось: "${nl}" / Получено: "${el}"`);
      e.push(`   Лишние: ${f2s(xf)||'нет'} / Не хватает: ${f2s(mf)||'нет'}`);

      const fixResult = autoFixObv(ws, nf);
      
      let fixedExtr = '';
      for (let fw of fixResult) {
        fixedExtr += safeExtract(fw.word, fw.suggestedObv) || '';
      }
      const fixedFreq = lfreq(fixedExtr);
      
      if (f2s(fixedFreq) === nl) {
        e.push(`💡 Предложены исправленные obv (лимит 2-3 буквы на слово).`);
        for (let i=0; i<wds.length; i++) {
          wds[i].suggestedObv = [...fixResult[i].suggestedObv];
        }
      } else {
        e.push(`⚠️ Автоподбор не смог найти точное решение. Попробуйте вручную.`);
        for (let wd of wds) wd.suggestedObv = [...wd.obv];
      }
    } else {
      for (let i=0;i<ws.length;i++){
        let w=ws[i];
        if(w.letters!==undefined&&w.letters!==wds[i].extracted){
          wds[i].lettersOk=false;
          e.push(`ℹ️ Слово ${i} ('${w.word}'): letters устарело ('${w.letters}'≠'${wds[i].extracted}'). Будет обновлено.`);
        }
      }
    }
  }
  return {level:lv, passed:e.length===0||e.every(x=>x.startsWith('ℹ️')), errors:e, pf, fn, extr, sc, to, wds, fixedPrefilled, starFixed};
}

function buildFixedText(src,data,results){
  let t=src;
  for(let li=0;li<data.length;li++){
    let lvl=data[li].level, r=results[li]; if(!r) continue;
    let ws=data[li].words;
    let idx=t.indexOf(`"level": ${lvl}`); if(idx===-1) continue;
    
    if(r.starFixed){
      const pfIdx = t.indexOf(`"prefilled":`, idx);
      if(pfIdx >= 0 && pfIdx < (t.indexOf(`"level":`, idx+1) || t.length)) {
        const lineStart = t.lastIndexOf('\n', pfIdx) + 1;
        const lineEnd = t.indexOf('\n', pfIdx);
        const lineEndIdx = lineEnd === -1 ? t.length : lineEnd;
        let line = t.slice(lineStart, lineEndIdx);
        const oldPf = r.pf;
        const newPf = r.fixedPrefilled;
        line = line.replace(`"${oldPf}"`, `"${newPf}"`);
        t = t.slice(0, lineStart) + line + t.slice(lineEndIdx);
      }
    }
    
    let end=t.slice(idx).match(/"level"\s*:\s*\d+/); end=end?idx+end.index: t.length;
    let wps=[], re=/"word"\s*:\s*"([^"]+)"/g, m;
    while((m=re.exec(t))!==null) if(m.index>idx&&m.index<end) wps.push({idx:m.index,word:m[1]});
    for(let wi=0;wi<ws.length;wi++){
      let wData=ws[wi], wd=r.wds[wi]; if(!wd) continue;
      let newObv=JSON.stringify(wd.suggestedObv);
      let oldObv=JSON.stringify(wData.obv);
      let newL=safeExtract(wData.word,wd.suggestedObv)||'';
      let wp=wps.find(p=>p.word===wData.word); if(!wp) continue;
      let ls=t.lastIndexOf('\n',wp.idx)+1, le=t.indexOf('\n',wp.idx); if(le===-1)le=t.length;
      let line=t.slice(ls,le);
      if(newObv!==oldObv){
        line=line.replace(oldObv,newObv);
      }
      let lm=line.match(/"letters"\s*:\s*"([^"]*)"/);
      if(lm&&lm[1]!==newL){
        line=line.replace(`"letters": "${lm[1]}"`,`"letters": "${newL}"`);
      }
      t=t.slice(0,ls)+line+t.slice(le);
    }
  }
  return t;
}

function generateReport(results, filename) {
    let r = `Отчёт о проверке: ${filename}\n${'='.repeat(50)}\n`;
    let total = results.length, passed = results.filter(r=>r.passed).length, failed = total-passed;
    r += `Всего уровней: ${total}\nПройдено: ${passed}\nС ошибками: ${failed}\n\n`;
    for (let res of results) {
        if (res.passed && !res.errors.some(e=>e.startsWith('ℹ️'))) continue;
        r += `--- Уровень ${res.level} ${res.passed?'(OK, letters устарели)':'(ОШИБКИ)'} ---\n`;
        r += `prefilled: "${res.pf}"`;
        if (res.starFixed) r += ` → "${res.fixedPrefilled}" (исправлено)`;
        r += `\nfinal: "${res.fn}"\n`;
        r += `Извлечено: "${res.extr}"\n`;
        for (let e of res.errors) r += `  ${e}\n`;
        r += `\nДетали по словам:\n`;
        r += `| # | Слово | Текущий obv | Извлечено | Предлагаемый obv |\n`;
        r += `|---|-------|-------------|-----------|-------------------|\n`;
        for (let i=0; i<res.wds.length; i++) {
            let wd = res.wds[i];
            let sameObv = JSON.stringify(wd.obv) === JSON.stringify(wd.suggestedObv);
            let obvStr = sameObv ? `[${wd.obv.join(', ')}]` : `[${wd.obv.join(', ')}] → [${wd.suggestedObv.join(', ')}]`;
            r += `| ${i+1} | ${wd.word} | [${wd.obv.join(', ')}] | ${wd.extracted} | ${obvStr} |\n`;
        }
        r += `\n`;
    }
    return r;
}

function downloadText(text, filename, type='application/json') {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function process(data,fname,warns){
  let levels=Array.isArray(data)?data:(data?.levels||[data]);
  if(!levels.length){res.innerHTML='<p>Нет уровней.</p>';return}
  lastData=levels;
  let results=levels.map(validate);
  lastResults=results;
  let total=results.length, passed=results.filter(r=>r.passed).length, failed=total-passed;

  let html='';
  if(warns.length) warns.forEach(w=>html+=`<div style="background:#fffbeb;border:1px solid #fcd34d;padding:.5rem;margin-bottom:1rem">${w}</div>`);
  html+=`<div class="summary"><div class="stat">📄 ${fname}</div><div class="stat">Всего: ${total}</div><div class="stat pass">✅ Пройдено: ${passed}</div><div class="stat fail">❌ Ошибок: ${failed}</div></div>`;
  html+=`<button class="btn" onclick="downloadReport()">📄 Скачать отчёт (TXT)</button>`;
  html+=`<button class="btn" onclick="downloadFixed()">📥 Скачать исправленный JSON</button>`;

  for(let r of results){
    let cls=r.passed?'pass':'fail';
    html+=`<div class="card ${cls}"><div class="cardhead"><span>Уровень ${r.level}</span><span class="badge ${cls}">${r.passed?'OK':'ОШИБКИ'}</span></div>`;
    html+=`<div class="cardbody">`;
    let pfDisplay = r.starFixed 
      ? `<span class="old-prefilled">"${r.pf}"</span> → <span class="new-prefilled">"${r.fixedPrefilled}"</span>`
      : `"${r.pf}"`;
    html+=`<div style="font-family:monospace;color:var(--gray);">prefilled: ${pfDisplay} | extracted: "${r.extr}" | final: "${r.fn}"</div>`;
    if(r.errors.length>0){
      html+=`<ul class="errs">`; r.errors.forEach(e=>html+=`<li>${e.replace(/\n/g,'<br>')}</li>`); html+=`</ul>`;
    }
    html+=`<table><tr><th>#</th><th>Слово</th><th>Текущий obv</th><th>Извлечено</th><th>→ Предлагаемый obv</th></tr>`;
    r.wds.forEach((wd,i)=>{
      const sameObv = JSON.stringify(wd.obv) === JSON.stringify(wd.suggestedObv);
      const obvDisplay = sameObv
        ? `[${wd.obv.join(', ')}]`
        : `<span class="old-obv">[${wd.obv.join(', ')}]</span> <span class="fix-suggest">[${wd.suggestedObv.join(', ')}]</span>`;
      html+=`<tr>
        <td>${i+1}</td>
        <td>${wd.word}</td>
        <td>${obvDisplay}</td>
        <td>${wd.extracted}</td>
        <td>${obvDisplay}</td>
      </tr>`;
    });
    html+=`</table></div></div>`;
  }
  res.innerHTML=html;
  window.downloadFixed=()=>{
    if(!lastText||!lastResults||!lastData) return alert('Нет данных');
    try{
      let fixed=buildFixedText(lastText,lastData,lastResults);
      downloadText(fixed,`${lastFname}_fixed.json`);
    }catch(e){alert('Ошибка: '+e.message)}
  };
  window.downloadReport=()=>{
    if(!lastResults) return alert('Нет данных');
    let report=generateReport(lastResults, fname);
    downloadText(report,`${lastFname}_report.txt`,'text/plain');
  };
}
})();
</script>
</body>
</html>
