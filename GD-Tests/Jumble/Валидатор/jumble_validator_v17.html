<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumble Validator – Финальный</title>
<style>
:root {
    --bg: #fff; --text: #000; --accent: #1e3a8a; --border: #000;
    --ok: #166534; --err: #991b1b; --warn: #92400e; --light: #f3f4f6; --gray: #6b7280;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 1.75rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
.drop-zone { border: 2px dashed var(--border); border-radius: 4px; padding: 3rem; text-align: center; cursor: pointer; margin-bottom: 1.5rem; }
.drop-zone.dragover { background: var(--light); }
.btn { background: var(--accent); color: #fff; border: none; padding: 0.6rem 1.2rem; font-weight: 600; cursor: pointer; border-radius: 3px; margin-right: 0.5rem; }
.btn:hover { opacity: 0.9; }
.summary { display: flex; gap: 1.5rem; margin: 1rem 0; font-weight: 600; flex-wrap: wrap; }
.stat { padding: 0.75rem 1.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--light); }
.stat.pass { border-left: 4px solid var(--ok); } .stat.fail { border-left: 4px solid var(--err); }
.level-card { border: 1px solid var(--border); margin-bottom: 1rem; border-radius: 4px; overflow: hidden; }
.level-card.pass { border-left: 4px solid var(--ok); } .level-card.fail { border-left: 4px solid var(--err); }
.level-header { padding: 0.5rem 1rem; background: var(--light); font-weight: 600; display: flex; justify-content: space-between; }
.badge { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 3px; }
.badge.pass { background: #dcfce7; color: var(--ok); } .badge.fail { background: #fce4ec; color: var(--err); }
.level-body { padding: 1rem; }
.error-list { list-style: none; padding: 0; }
.error-list li { background: #fff5f5; border: 1px solid #fecaca; padding: 0.5rem; margin-bottom: 0.25rem; font-family: monospace; white-space: pre-wrap; }
table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.85rem; }
th, td { border: 1px solid var(--border); padding: 0.3rem 0.5rem; text-align: left; vertical-align: top; }
th { background: var(--light); }
.old-obv { text-decoration: line-through; color: var(--err); margin-right: 0.5rem; }
.fix-suggest { color: var(--accent); font-weight: bold; }
.old-prefilled { text-decoration: line-through; color: var(--err); }
.new-prefilled { color: var(--accent); font-weight: bold; }
.info-row { font-size: 0.85rem; color: var(--gray); margin-top: 0.5rem; font-family: monospace; }
.warn-banner { background: #fffbeb; border: 1px solid #fcd34d; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 4px; font-size: 0.9rem; color: var(--warn); }
</style>
</head>
<body>
<h1>🧩 Jumble Validator – Финальный</h1>
<div id="dropZone" class="drop-zone">
    <div>📁 Перетащите JSON-файл сюда или кликните для выбора</div>
    <input type="file" id="fileInput" accept=".json" hidden>
</div>
<div id="results"></div>

<script>
(function() {
    const dz = document.getElementById('dropZone');
    const fi = document.getElementById('fileInput');
    const res = document.getElementById('results');

    let lastResults = null;
    let lastFixedData = null;
    let lastFilename = 'levels';

    dz.addEventListener('click', () => fi.click());
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
        e.preventDefault();
        dz.classList.remove('dragover');
        if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
    });
    fi.addEventListener('change', e => {
        if (e.target.files.length) loadFile(e.target.files[0]);
    });

    function loadFile(file) {
        if (!file.name.endsWith('.json')) { alert('Нужен .json файл'); return; }
        const reader = new FileReader();
        reader.onload = e => {
            let raw = e.target.result;
            let warns = [];
            let data;
            try {
                data = JSON.parse(raw);
            } catch (err1) {
                // Автофикс неэкранированных кавычек
                raw = raw.replace(/(?<!\\)"(?=(?:[^"]*"[^"]*")*[^"]*$)/g, "'");
                try {
                    data = JSON.parse(raw);
                    warns.push('⚠️ Автоисправлены неэкранированные кавычки в исходном файле.');
                } catch (err2) {
                    res.innerHTML = '<p style="color:var(--err)">Ошибка парсинга JSON. Проверьте синтаксис.</p>';
                    return;
                }
            }
            lastFilename = file.name.replace(/\.json$/i, '');
            process(data, file.name, warns);
        };
        reader.readAsText(file);
    }

    // ==================== CORE LOGIC ====================

    const MIN_OBV = 2;
    const MAX_OBV = 3;

    const safeExtract = (word, obv) => {
        if (!obv || obv.length === 0) return '';
        let r = [];
        for (let idx of obv) {
            if (idx < 1 || idx > word.length) return null;
            r.push(word[idx - 1]);
        }
        return r.join('');
    };

    const countStars = s => (s.match(/\*/g) || []).length;

    const letterFreq = s => {
        const f = {};
        for (let ch of s) {
            if (/[A-Za-z]/.test(ch)) {
                ch = ch.toUpperCase();
                f[ch] = (f[ch] || 0) + 1;
            }
        }
        return f;
    };

    const subtractFreq = (a, b) => {
        const res = {};
        for (let k in a) res[k] = a[k];
        for (let k in b) {
            res[k] = (res[k] || 0) - b[k];
            if (res[k] < 0) return null;
            if (res[k] === 0) delete res[k];
        }
        return res;
    };

    const freqToString = f => Object.keys(f).sort().map(k => k.repeat(f[k])).join('');

    const diffFreqs = (extractedFreq, neededFreq) => {
        const extra = {}, missing = {};
        for (let k in extractedFreq) {
            const d = extractedFreq[k] - (neededFreq[k] || 0);
            if (d > 0) extra[k] = d;
        }
        for (let k in neededFreq) {
            const d = neededFreq[k] - (extractedFreq[k] || 0);
            if (d > 0) missing[k] = d;
        }
        return { extra, missing };
    };

    const findLetterPositions = (word, letter, excludeObv) => {
        const positions = [];
        const upper = word.toUpperCase();
        const upperLetter = letter.toUpperCase();
        for (let i = 0; i < upper.length; i++) {
            if (upper[i] === upperLetter && !excludeObv.includes(i + 1)) {
                positions.push(i + 1);
            }
        }
        return positions;
    };

    /**
     * Исправляет prefilled, чтобы количество звёздочек соответствовало буквам в final.
     * Проходит по prefilled и final параллельно, заменяя группы звёздочек на точное
     * количество букв из соответствующей группы final.
     */
    function fixPrefilledByFinal(prefilled, final) {
        let result = '';
        let pi = 0, fi = 0;
        while (pi < prefilled.length || fi < final.length) {
            // Пропускаем не-буквы в final
            while (fi < final.length && !/[A-Za-z]/.test(final[fi])) {
                if (pi < prefilled.length && prefilled[pi] === final[fi]) {
                    result += prefilled[pi];
                    pi++;
                }
                fi++;
            }
            if (pi >= prefilled.length && fi >= final.length) break;
            // Копируем не-звёздочки из prefilled
            if (pi < prefilled.length && prefilled[pi] !== '*') {
                result += prefilled[pi];
                pi++;
                continue;
            }
            // Группа звёздочек
            let starLen = 0;
            while (pi < prefilled.length && prefilled[pi] === '*') { starLen++; pi++; }
            // Группа букв в final
            let letterLen = 0;
            while (fi < final.length && /[A-Za-z]/.test(final[fi])) { letterLen++; fi++; }
            result += '*'.repeat(letterLen);
        }
        return result;
    }

    /**
     * Автоподбор obv для всех слов уровня.
     * Возвращает массив массивов индексов (по одному на слово),
     * строго соблюдая MIN_OBV/MAX_OBV.
     */
    function autoFixObv(words, neededFreq) {
        const remaining = { ...neededFreq };
        const assignments = words.map(() => []);

        // Фаза 1: раздаём необходимые буквы по словам (жадно, с лимитом MAX_OBV)
        for (let letter in remaining) {
            while (remaining[letter] > 0) {
                let bestWord = -1, bestPos = -1;
                for (let wi = 0; wi < words.length; wi++) {
                    if (assignments[wi].length >= MAX_OBV) continue;
                    const positions = findLetterPositions(words[wi].word, letter, assignments[wi]);
                    if (positions.length > 0) {
                        bestWord = wi;
                        bestPos = positions[0];
                        break;
                    }
                }
                if (bestWord >= 0) {
                    assignments[bestWord].push(bestPos);
                    remaining[letter]--;
                } else {
                    break; // Невозможно разместить
                }
            }
        }

        // Фаза 2: дополняем до MIN_OBV любыми доступными буквами
        for (let wi = 0; wi < words.length; wi++) {
            const word = words[wi].word;
            while (assignments[wi].length < MIN_OBV && assignments[wi].length < word.length) {
                for (let i = 0; i < word.length; i++) {
                    if (!assignments[wi].includes(i + 1)) {
                        assignments[wi].push(i + 1);
                        break;
                    }
                }
            }
            assignments[wi].sort((a, b) => a - b);
        }

        return assignments;
    }

    /**
     * Полная обработка одного уровня.
     * Возвращает объект с полями: level, passed, errors, wordReport, fixed (исправленный объект уровня).
     */
    function processLevel(levelData) {
        const errors = [];
        const lvl = levelData.level ?? '?';
        const prefilled = levelData.prefilled || '';
        const final = levelData.final || '';
        const words = (levelData.words || []).map(w => ({
            ...w,
            obv: [...(w.obv || [])],
            word: w.word || ''
        }));

        // Копия для исправленного варианта
        const fixed = JSON.parse(JSON.stringify(levelData));
        fixed.words = words.map(w => ({ ...w, obv: [...w.obv] }));

        // Шаг 1: звёздочки
        let starCount = countStars(prefilled);
        const totalObv = words.reduce((s, w) => s + w.obv.length, 0);
        let fixedPrefilled = prefilled;
        let starFixed = false;

        if (starCount !== totalObv) {
            if (starCount > totalObv) {
                fixedPrefilled = fixPrefilledByFinal(prefilled, final);
                const newStarCount = countStars(fixedPrefilled);
                if (newStarCount === totalObv) {
                    starFixed = true;
                    errors.push(`⚠️ Шаг 1: звёздочек ${starCount}, obv ${totalObv}. prefilled исправлен.`);
                    starCount = newStarCount;
                    fixed.prefilled = fixedPrefilled;
                } else {
                    errors.push(`⚠️ Шаг 1: звёздочек ${starCount}, obv ${totalObv}. Не удалось исправить prefilled автоматически (получилось ${newStarCount} звёзд).`);
                }
            } else {
                errors.push(`⚠️ Шаг 1: звёздочек ${starCount}, obv ${totalObv}. Лишние индексы в obv, нужна ручная проверка.`);
            }
        }

        // Извлечение букв
        const wordReport = words.map((w, i) => {
            const part = safeExtract(w.word, w.obv);
            return {
                word: w.word,
                originalObv: [...w.obv],
                extracted: part || '',
                hasError: part === null,
                suggestedObv: [...w.obv],
                lettersOk: true
            };
        });

        const extracted = wordReport.map(wr => wr.extracted).join('');
        const preExistingLetters = fixedPrefilled.replace(/\*/g, '');
        const preFreq = letterFreq(preExistingLetters);
        const finalFreq = letterFreq(final);
        const neededFreq = subtractFreq(finalFreq, preFreq);

        let anagramOk = true;

        if (neededFreq === null) {
            errors.push(`❌ Шаг 2a: В prefilled есть буквы, которых нет в final.`);
            anagramOk = false;
        } else {
            const neededLetters = freqToString(neededFreq);
            const extractedFreq = letterFreq(extracted);
            const extractedLetters = freqToString(extractedFreq);

            if (neededLetters !== extractedLetters) {
                anagramOk = false;
                const diff = diffFreqs(extractedFreq, neededFreq);
                const extraLetters = freqToString(diff.extra);
                const missingLetters = freqToString(diff.missing);

                errors.push(`❌ Шаг 2b (Анаграмма): не совпадает.`);
                errors.push(`   Ожидалось: "${neededLetters}"`);
                errors.push(`   Получено:  "${extractedLetters}"`);
                if (extraLetters) errors.push(`   Лишние:    ${extraLetters}`);
                if (missingLetters) errors.push(`   Не хватает: ${missingLetters}`);

                // Автоподбор obv
                const newAssignments = autoFixObv(words, neededFreq);

                let suggestedExtracted = '';
                for (let i = 0; i < words.length; i++) {
                    const part = safeExtract(words[i].word, newAssignments[i]);
                    suggestedExtracted += (part || '');
                    wordReport[i].suggestedObv = [...newAssignments[i]];
                }
                const suggestedFreq = letterFreq(suggestedExtracted);

                if (freqToString(suggestedFreq) === neededLetters) {
                    errors.push(`💡 Предложены исправленные obv (лимит 2–3 буквы на слово).`);
                    for (let i = 0; i < words.length; i++) {
                        fixed.words[i].obv = [...newAssignments[i]];
                        fixed.words[i].letters = safeExtract(words[i].word, newAssignments[i]) || '';
                    }
                } else {
                    errors.push(`⚠️ Автоподбор не смог найти точное решение. Нужна ручная проверка.`);
                    for (let i = 0; i < words.length; i++) {
                        wordReport[i].suggestedObv = [...wordReport[i].originalObv];
                    }
                }
            } else {
                // Анаграмма верна — проверяем letters
                for (let i = 0; i < words.length; i++) {
                    const w = words[i];
                    const wr = wordReport[i];
                    if (w.letters !== undefined && w.letters !== wr.extracted) {
                        wr.lettersOk = false;
                        errors.push(`ℹ️ Слово ${i + 1} ('${w.word}'): letters "${w.letters}" ≠ извлечено "${wr.extracted}". Обновлено.`);
                        fixed.words[i].letters = wr.extracted;
                    } else if (w.letters === undefined) {
                        fixed.words[i].letters = wr.extracted;
                    }
                }
            }
        }

        // Ошибки индексов
        for (let i = 0; i < words.length; i++) {
            const w = words[i];
            const wr = wordReport[i];
            if (wr.hasError) {
                errors.push(`❌ Слово ${i + 1} ('${w.word}'): индекс вне границ слова.`);
                const validObv = w.obv.filter(idx => idx >= 1 && idx <= w.word.length);
                if (validObv.length > 0) {
                    fixed.words[i].obv = validObv;
                    fixed.words[i].letters = safeExtract(w.word, validObv) || '';
                    wordReport[i].suggestedObv = [...validObv];
                }
            }
        }

        // Финальный расчёт letters для fixed
        for (let i = 0; i < fixed.words.length; i++) {
            fixed.words[i].letters = safeExtract(fixed.words[i].word, fixed.words[i].obv) || '';
        }

        const passed = errors.length === 0 || errors.every(e => e.startsWith('ℹ️') || e.startsWith('💡') || e.startsWith('⚠️ Шаг 1'));

        return {
            level: lvl,
            passed,
            errors,
            prefilled,
            fixedPrefilled,
            final,
            extracted,
            starCount,
            totalObv,
            starFixed,
            anagramOk,
            wordReport,
            fixed
        };
    }

    // ==================== ОТЧЁТ ====================

    function generateReport(results, filename) {
        let r = `Отчёт о проверке: ${filename}\n${'='.repeat(60)}\n`;
        const total = results.length;
        const passed = results.filter(r => r.passed).length;
        const failed = total - passed;
        r += `Всего уровней: ${total}\nПройдено: ${passed}\nС ошибками: ${failed}\n\n`;
        for (const res of results) {
            if (res.passed && res.errors.length === 0) continue;
            r += `─── Уровень ${res.level} ${res.passed ? '(OK)' : '(ОШИБКИ)'} ───\n`;
            r += `prefilled: "${res.prefilled}"`;
            if (res.starFixed) r += ` → "${res.fixedPrefilled}"`;
            r += `\nfinal: "${res.final}"\n`;
            r += `Извлечено: "${res.extracted}"\n`;
            for (const e of res.errors) {
                r += `  ${e}\n`;
            }
            if (res.wordReport.some(wr => JSON.stringify(wr.originalObv) !== JSON.stringify(wr.suggestedObv))) {
                r += `\n  Изменения obv:\n`;
                for (let i = 0; i < res.wordReport.length; i++) {
                    const wr = res.wordReport[i];
                    if (JSON.stringify(wr.originalObv) !== JSON.stringify(wr.suggestedObv)) {
                        r += `    Слово ${i + 1} (${wr.word}): [${wr.originalObv.join(', ')}] → [${wr.suggestedObv.join(', ')}]\n`;
                    }
                }
            }
            r += `\n`;
        }
        return r;
    }

    // ==================== СКАЧИВАНИЕ ====================

    function downloadJSON(data, filename) {
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function downloadText(text, filename) {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ==================== ГЛАВНАЯ ФУНКЦИЯ ====================

    function process(data, filename, warns) {
        let levels = [];
        if (Array.isArray(data)) {
            levels = data;
        } else if (data && Array.isArray(data.levels)) {
            levels = data.levels;
        } else if (data && typeof data === 'object') {
            levels = [data];
        }

        if (!levels.length) {
            res.innerHTML = '<p>Файл не содержит уровней.</p>';
            return;
        }

        const results = levels.map(processLevel);
        lastResults = results;
        lastFixedData = results.map(r => r.fixed);

        const total = results.length;
        const passed = results.filter(r => r.passed).length;
        const failed = total - passed;

        // ===== HTML =====
        let html = '';
        if (warns.length) {
            warns.forEach(w => { html += `<div class="warn-banner">${w}</div>`; });
        }

        html += `<div class="summary">
            <div class="stat">📄 ${filename}</div>
            <div class="stat">Уровней: ${total}</div>
            <div class="stat pass">✅ Пройдено: ${passed}</div>
            <div class="stat fail">❌ Ошибок: ${failed}</div>
        </div>`;

        html += `<div style="margin-bottom:1rem;">
            <button class="btn" onclick="downloadReport()">📄 Скачать отчёт (TXT)</button>
            <button class="btn" onclick="downloadFixedJSON()">📥 Скачать исправленный JSON</button>
        </div>`;

        for (const r of results) {
            const cls = r.passed ? 'pass' : 'fail';
            html += `<div class="level-card ${cls}">
                <div class="level-header">
                    <span>Уровень ${r.level}</span>
                    <span class="badge ${cls}">${r.passed ? 'OK' : 'ОШИБКИ'}</span>
                </div>`;
            if (!r.passed || r.errors.length > 0) {
                html += `<div class="level-body">`;
                let pfDisplay = r.starFixed
                    ? `<span class="old-prefilled">"${r.prefilled}"</span> → <span class="new-prefilled">"${r.fixedPrefilled}"</span>`
                    : `"${r.prefilled}"`;
                html += `<div class="info-row">prefilled: ${pfDisplay} | extracted: "${r.extracted}" | final: "${r.final}"</div>`;
                if (r.errors.length > 0) {
                    html += `<ul class="error-list">`;
                    r.errors.forEach(e => { html += `<li>${e.replace(/\n/g, '<br>')}</li>`; });
                    html += `</ul>`;
                }
                html += `<table>
                    <tr><th>#</th><th>Слово</th><th>Текущий obv</th><th>Извлечено</th><th>→ Предлагаемый obv</th><th>Новое letters</th></tr>`;
                r.wordReport.forEach((wr, i) => {
                    const sameObv = JSON.stringify(wr.originalObv) === JSON.stringify(wr.suggestedObv);
                    const obvDisplay = sameObv
                        ? `[${wr.originalObv.join(', ')}]`
                        : `<span class="old-obv">[${wr.originalObv.join(', ')}]</span> <span class="fix-suggest">[${wr.suggestedObv.join(', ')}]</span>`;
                    const newLetters = safeExtract(wr.word, wr.suggestedObv) || '';
                    html += `<tr>
                        <td>${i + 1}</td>
                        <td>${wr.word}</td>
                        <td>${obvDisplay}</td>
                        <td>${wr.extracted}</td>
                        <td>${obvDisplay}</td>
                        <td>${newLetters}</td>
                    </tr>`;
                });
                html += `</table></div>`;
            }
            html += `</div>`;
        }

        res.innerHTML = html;

        window.downloadReport = () => {
            if (!lastResults) { alert('Нет данных для отчёта.'); return; }
            const report = generateReport(lastResults, filename);
            downloadText(report, `${lastFilename}_report.txt`);
        };

        window.downloadFixedJSON = () => {
            if (!lastFixedData) { alert('Нет данных для экспорта.'); return; }
            downloadJSON(lastFixedData, `${lastFilename}_fixed.json`);
        };
    }
})();
</script>
</body>
</html>
