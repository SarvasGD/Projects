<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jumble Mobile v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F5F5F5;color:#333;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;max-width:480px;margin:0 auto}
.menu-overlay{position:fixed;inset:0;background:#F5F5F5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:150}
.menu-overlay.hid{display:none!important}
.lang-badge{position:absolute;top:12px;left:14px;font-size:12px;font-weight:700;color:#999}
.menu-title{font-size:34px;font-weight:800;margin-bottom:6px;color:#333}
.menu-sub{font-size:14px;color:#777;margin-bottom:12px;text-align:center;line-height:1.4;padding:0 20px}
.menu-progress{font-size:16px;font-weight:700;color:#2196F3;margin-bottom:28px}
.menu-btn{padding:14px 40px;font-size:18px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin:6px 0;min-width:260px;transition:.15s}
.menu-btn:active{transform:scale(.97)}
.btn-play{background:#4CAF50;color:#fff}
.btn-lang{background:#2196F3;color:#fff}
.btn-reset{background:#F44336;color:#fff;font-size:14px;padding:10px 30px;min-width:220px;margin-top:16px}
.hdr{width:100%;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.hdr .li{font-weight:700;font-size:17px}
.hdr button{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.hdr button:active{background:#eee}
.cd{font-size:13px;color:#FF9800;font-weight:700}
.cart{width:100%;padding:12px;text-align:center}
.cart-ph{width:100%;min-height:130px;background:#E8F5E9;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;margin-bottom:6px}
.cart-emoji{font-size:52px;margin-bottom:8px}
.cart-desc{font-size:13px;color:#444;line-height:1.4;font-style:italic;max-width:95%}
.clue{font-style:italic;color:#555;font-size:14px;line-height:1.4;padding:0 4px;margin-top:4px}
.fa{width:100%;padding:6px 12px;text-align:center}
.fs{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:40px;padding:6px;background:#FFF3E0;border-radius:8px;margin-bottom:6px}
.fsl{width:32px;height:36px;border:2px dashed #FF9800;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#E65100;background:#fff;cursor:pointer;transition:.2s}
.fsl.fi{border-style:solid;background:#FFE0B2}
.confirm-bar{width:100%;padding:4px 12px;text-align:center;display:none}
.confirm-bar.vis{display:block}
.confirm-btn{padding:10px 30px;background:#4CAF50;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.bk{width:100%;padding:2px 12px 6px;text-align:center}
.bkl{font-size:11px;color:#888;margin-bottom:3px}
.bkc{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:40px;padding:6px;background:#E3F2FD;border-radius:8px}
.blt{width:32px;height:36px;background:#2196F3;color:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;transition:.15s;user-select:none}
.blt:active{transform:scale(.9)}
.wa{width:100%;flex:1;padding:6px 12px 12px}
.wt{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.wt::-webkit-scrollbar{display:none}
.wtb{flex:0 0 auto;min-width:48px;max-width:80px;padding:8px 6px;border:2px solid #ddd;border-radius:7px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;background:#fff;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.wtb.ac{border-color:#2196F3;background:#E3F2FD;color:#1565C0}
.wtb.sv{border-color:#4CAF50;background:#C8E6C9;color:#2E7D32;font-size:12px}
.wtb.unsolved{color:#999;font-size:10px}
.sa{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:10px;min-height:40px;padding:6px}
.sl{width:36px;height:40px;background:#fff;border:2px solid #bbb;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;transition:.15s;user-select:none}
.sl:active{transform:scale(.9)}
.sl.us{opacity:.3;pointer-events:none}
.ac{display:flex;justify-content:center;gap:3px;min-height:44px}
.acl{width:36px;height:44px;border:2px solid #ccc;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff;cursor:pointer;transition:.2s;position:relative}
.acl.ci{border-color:#2196F3}
.acl.ci::after{content:'';position:absolute;inset:-3px;border:2px solid #2196F3;border-radius:50%;opacity:.4}
.acl.fl{background:#E3F2FD;border-color:#2196F3}
.acl.co{background:#C8E6C9;border-color:#4CAF50;color:#2E7D32}
.acl.wr{background:#FFCDD2;border-color:#F44336;animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.vo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.vo.sh{display:flex}
.vc{background:#fff;border-radius:14px;padding:28px;text-align:center;max-width:300px;animation:pop .3s}
.vc h2{font-size:26px;margin-bottom:6px}
.vc .ar{font-size:20px;color:#E65100;font-weight:700;margin:10px 0}
.vc button{margin-top:14px;padding:10px 28px;background:#4CAF50;color:#fff;border:none;border-radius:7px;font-size:16px;cursor:pointer}
.dp{position:fixed;top:48px;right:6px;background:rgba(0,0,0,.92);color:#0f0;padding:10px;border-radius:7px;font-size:11px;display:none;z-index:200;max-width:200px}
.dp.sh{display:block}
.dp button{display:block;width:100%;margin:3px 0;padding:5px;background:#333;color:#0f0;border:1px solid #0f0;border-radius:3px;cursor:pointer;font-size:10px}
.hm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50}
.hm.sh{display:flex}
.hmc{background:#fff;border-radius:10px;padding:20px;max-width:280px;width:90%}
.hmc h3{margin-bottom:14px;text-align:center}
.hb{display:block;width:100%;padding:10px;margin:6px 0;border:2px solid #FF9800;border-radius:7px;background:#FFF3E0;font-size:13px;cursor:pointer;text-align:left}
.hb span{float:right;font-weight:700;color:#E65100}
.hcl{display:block;width:100%;padding:8px;margin-top:10px;background:#eee;border:none;border-radius:7px;cursor:pointer;font-size:13px}
.err{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#F44336;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:300;text-align:center;max-width:90%}
.err.sh{display:block}
.error-screen{position:fixed;inset:0;background:#333;color:#F44336;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:20px;text-align:center}
.error-screen.sh{display:flex}
.error-screen h2{font-size:24px;margin-bottom:12px}
.error-screen p{color:#fff;font-size:14px;margin-bottom:20px;max-width:90%;word-break:break-word}
.error-screen button{padding:12px 30px;background:#F44336;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#gameContainer{display:none}
#gameContainer.vis{display:contents}
</style>
</head>
<body>

<div class="error-screen" id="errorScreen">
  <h2>⚠️ Ошибка</h2>
  <p id="errorMsg">Неизвестная ошибка</p>
  <button onclick="location.reload()">Перезагрузить</button>
</div>

<div class="menu-overlay" id="mainMenu">
  <div class="lang-badge" id="menuLangBadge">🇷🇺 РУС</div>
  <div class="menu-title">JUMBLE</div>
  <div class="menu-sub" id="menuSub">Мобильная словесная головоломка</div>
  <div class="menu-progress" id="menuProgress">Уровень 1 / 10</div>
  <button class="menu-btn btn-play" id="btnPlay" onclick="safeStartGame()">▶ ИГРАТЬ</button>
  <button class="menu-btn btn-lang" id="btnLang" onclick="toggleLanguage()">🌐 English</button>
  <button class="menu-btn btn-reset" id="btnReset" onclick="fullGlobalReset()">🗑 Сброс прогресса</button>
</div>

<div id="gameContainer">
  <div class="hdr" id="gameHdr">
    <button onclick="backToMenu()" id="btnBack">←</button>
    <span class="li" id="lvlInfo">Уровень 1</span>
    <div style="display:flex;gap:6px;align-items:center">
      <span class="cd" id="coinDisp">💰 100</span>
      <button onclick="showHints()" id="btnHint">💡</button>
      <button onclick="toggleDebug()" id="btnDebug" title="Отладка">🔧</button>
    </div>
  </div>
  <div class="cart" id="gameCart">
    <div class="cart-ph">
      <div class="cart-emoji" id="cartEmoji"></div>
      <div class="cart-desc" id="cartDesc"></div>
    </div>
    <div class="clue" id="clueTxt"></div>
  </div>
  <div class="fa" id="gameFa"><div class="fs" id="finSlots"></div></div>
  <div class="confirm-bar" id="confirmBar">
    <button class="confirm-btn" onclick="confirmCheatAnswer()" id="btnConfirm">✓ Подтвердить ответ</button>
  </div>
  <div class="bk" id="gameBk"><div class="bkl" id="basketLabel">🧺 Собранные буквы</div><div class="bkc" id="basket"></div></div>
  <div class="wa" id="gameWa">
    <div class="wt" id="wTabs"></div>
    <div class="sa" id="scrArea"></div>
    <div class="ac" id="ansCells"></div>
  </div>
</div>

<div class="vo" id="vicOv">
  <div class="vc">
    <h2 id="vicTitle">🎉 Решено!</h2>
    <div class="ar" id="vicAns"></div>
    <div id="vicSt"></div>
    <button onclick="nextLevel()" id="btnNext">Следующий ▶</button>
  </div>
</div>

<div class="hm" id="hintMod">
  <div class="hmc">
    <h3 id="hintTitle">💡 Подсказки</h3>
    <button class="hb" onclick="useHint('letter')" id="hLetter">Показать букву <span>50 💰</span></button>
    <button class="hb" onclick="useHint('showWord')" id="hShowWord">Показать ответ слова <span>100 💰</span></button>
    <button class="hb" onclick="useHint('word')" id="hWord">Решить слово (−1) <span>150 💰</span></button>
    <button class="hb" onclick="useHint('final')" id="hFinal">Буква финала <span>100 💰</span></button>
    <button class="hcl" onclick="closeHints()" id="hClose">Закрыть</button>
  </div>
</div>

<div class="dp" id="dbgPan">
  <strong id="dbgTitle">🔧 ОТЛАДКА / ЧИТЫ</strong>
  <button onclick="cheatShowWordAnswer()" id="chShowWord">Показать ответ слова</button>
  <button onclick="cheatSolveWordN1()" id="chSolveN1">Решить слово (−1 буква)</button>
  <button onclick="cheatRevealLetter()" id="chRevLet">Буква финала</button>
  <button onclick="cheatSkipLevel()" id="chSkip">Пропустить уровень</button>
  <button onclick="cheatJumpToLevel()" id="chJump">Перейти к уровню...</button>
  <button onclick="cheatShowAnswer()" id="chShowAns">Показать весь ответ</button>
  <button onclick="cheatAddCoins()" id="chCoins">+500 монет</button>
  <button onclick="cheatResetCurrentLevel()" id="chResetLvl">Сброс уровня</button>
</div>

<div class="err" id="errToast"></div>

<script>

function getDict(){return LANG==='ru'?DICT_RU:DICT_EN;}
function getFinals(){return LANG==='ru'?FINALS_RU:FINALS_EN;}

function validateFallbacks(fallbacks,dict){const ds=new Set(dict);const errs=[];for(const lvl of fallbacks){for(const w of lvl.words){if(!ds.has(w.a))errs.push(`L${lvl.id}: "${w.a}" NOT in dict!`);}const col=[];for(const w of lvl.words)for(const p of w.c)col.push(w.a[p]);const need=lvl.final.replace(/ /g,'').split('').sort();col.sort();if(JSON.stringify(col)!==JSON.stringify(need))errs.push(`L${lvl.id}: circled mismatch!`);}if(errs.length>0){console.error('Fallback errors:',errs);showErr('⚠️ Content errors. Check console.');}return errs.length===0;}

function generateLevels(){
  const dict=getDict(),finals=getFinals(),levels=[];
  for(let li=0;li<10;li++){
    const fin=finals[li],needed=fin.phrase.replace(/ /g,'').split('').sort();
    let best=null,att=0;
    while(att<800&&!best){
      att++;const words=[],used=new Set();let ok=true;
      for(let w=0;w<5;w++){let word=null,tries=0;while(!word&&tries<150){tries++;const c=dict[Math.floor(Math.random()*dict.length)];if(!used.has(c)&&c.length>=3&&c.length<=6){word=c;used.add(word);}}if(!word){ok=false;break;}words.push(word);}
      if(!ok)continue;
      const rem=[...needed],circled=[[],[],[],[],[]];let cov=true;
      for(const ch of rem){let found=false;const order=[0,1,2,3,4].sort(()=>Math.random()-.5);for(const wi of order){const pos=[];for(let p=0;p<words[wi].length;p++){if(words[wi][p]===ch&&!circled[wi].includes(p))pos.push(p);}if(pos.length>0){circled[wi].push(pos[Math.floor(Math.random()*pos.length)]);found=true;break;}}if(!found){cov=false;break;}}
      if(!cov)continue;
      const col=[];for(let wi=0;wi<5;wi++)for(const p of circled[wi])col.push(words[wi][p]);col.sort();
      if(JSON.stringify(col)===JSON.stringify(needed)){
        const scr=words.map(w=>{let s=w.split('');for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]];}const sc=s.join('');return sc===w?w.split('').reverse().join(''):sc;});
        const indexed=words.map((w,i)=>({w,scr:scr[i],c:circled[i],len:w.length}));
        indexed.sort((a,b)=>a.len-b.len);
        best={id:li+1,words:indexed.map(x=>({s:x.scr,a:x.w,c:x.c})),final:fin.phrase,clue:fin.clue,emoji:fin.emoji,desc:fin.desc};
      }
    }
    if(!best)best=getFallback(li);
    levels.push(best);
  }
  return levels;
}

let LEVELS=[];
let S={level:0,cw:0,coins:100,streak:0,solved:[],basket:[],finAns:[],ansSt:[],hints:0,t0:0,inGame:false,cheatRevealed:false};
function loadState(){try{const sv=JSON.parse(localStorage.getItem('jumble_v17'));if(sv){S.level=sv.l||0;S.coins=sv.c||100;S.streak=sv.s||0;}}catch(e){}try{const lg=localStorage.getItem('jumble_lang');if(lg)LANG=lg;}catch(e){}}
function saveState(){try{localStorage.setItem('jumble_v17',JSON.stringify({l:S.level,c:S.coins,s:S.streak}));}catch(e){}}

function safeStartGame(){try{startGame();}catch(e){showFatalError('startGame: '+e.message);}}
function startGame(){
  try{LEVELS=generateLevels();}catch(e){LEVELS=Array.from({length:10},(_,i)=>getFallback(i));}
  const allFb=Array.from({length:10},(_,i)=>getFallback(i));validateFallbacks(allFb,getDict());
  for(const lvl of LEVELS){try{const col=[];for(const w of lvl.words)for(const p of w.c)col.push(w.a[p]);const need=lvl.final.replace(/ /g,'').split('').sort();col.sort();if(JSON.stringify(col)!==JSON.stringify(need)){const fb=getFallback(lvl.id-1);Object.assign(lvl,fb);}}catch(e){const fb=getFallback(lvl.id-1);Object.assign(lvl,fb);}}
  S.inGame=true;S.cheatRevealed=false;
  document.getElementById('mainMenu').classList.add('hid');
  document.getElementById('gameContainer').classList.add('vis');
  transitionToLevel(S.level);
}

function transitionToLevel(n){
  document.getElementById('gameContainer').classList.add('vis');
  S.level=n;S.cw=0;S.hints=0;S.t0=Date.now();S.cheatRevealed=false;
  const L=LEVELS[n];
  S.solved=new Array(L.words.length).fill(false);
  S.basket=[];S.finAns=new Array(L.final.length).fill(null);
  S.ansSt=L.words.map(()=>[]);
  document.getElementById('finSlots').innerHTML='';
  document.getElementById('basket').innerHTML='';
  document.getElementById('wTabs').innerHTML='';
  document.getElementById('scrArea').innerHTML='';
  document.getElementById('ansCells').innerHTML='';
  document.getElementById('confirmBar').classList.remove('vis');
  renderFin();renderBsk();renderTabs();renderWord();
  document.getElementById('lvlInfo').textContent=`${t('level')} ${L.id}`;
  document.getElementById('coinDisp').textContent=`${t('coins')} ${S.coins}`;
  document.getElementById('cartEmoji').textContent=L.emoji;
  document.getElementById('cartDesc').textContent=L.desc||'';
  document.getElementById('clueTxt').textContent=L.clue;
}

function fullGlobalReset(){if(!confirm(t('resetConfirm')))return;S.level=0;S.coins=100;S.streak=0;S.inGame=false;saveState();document.getElementById('gameContainer').classList.remove('vis');document.getElementById('mainMenu').classList.remove('hid');document.getElementById('dbgPan').classList.remove('sh');document.getElementById('vicOv').classList.remove('sh');updateMenuProgress();showErr(LANG==='ru'?'Прогресс сброшен!':'Progress reset!');}
function cheatResetCurrentLevel(){const L=LEVELS[S.level];S.solved=new Array(L.words.length).fill(false);S.basket=[];S.finAns=new Array(L.final.length).fill(null);S.ansSt=L.words.map(()=>[]);S.cw=0;S.hints=0;S.t0=Date.now();S.cheatRevealed=false;document.getElementById('confirmBar').classList.remove('vis');renderFin();renderBsk();renderTabs();renderWord();showErr(t('lvlReset'));}
function backToMenu(){try{saveState();document.getElementById('gameContainer').classList.remove('vis');document.getElementById('dbgPan').classList.remove('sh');document.getElementById('vicOv').classList.remove('sh');document.getElementById('hintMod').classList.remove('sh');document.getElementById('mainMenu').classList.remove('hid');updateMenuProgress();}catch(e){document.getElementById('gameContainer').classList.remove('vis');document.getElementById('mainMenu').classList.remove('hid');}}
function updateMenuProgress(){document.getElementById('menuProgress').textContent=`${t('progress')} ${S.level+1} ${t('progressOf')} ${t('totalLevels')}`;}

function renderLvl(){if(!S.inGame||!LEVELS.length)return;const L=LEVELS[S.level];document.getElementById('lvlInfo').textContent=`${t('level')} ${L.id}`;document.getElementById('coinDisp').textContent=`${t('coins')} ${S.coins}`;document.getElementById('cartEmoji').textContent=L.emoji;document.getElementById('cartDesc').textContent=L.desc||'';document.getElementById('clueTxt').textContent=L.clue;renderFin();renderBsk();renderTabs();renderWord();}
function renderFin(){const L=LEVELS[S.level],c=document.getElementById('finSlots');c.innerHTML='';for(let i=0;i<L.final.length;i++){const ch=L.final[i],sl=document.createElement('div');sl.className='fsl';if(ch===' '){sl.style.border='none';sl.style.width='14px';}else if(S.finAns[i]){sl.textContent=S.finAns[i];sl.className+=' fi';sl.onclick=()=>{if(!S.cheatRevealed)rmFin(i);};}c.appendChild(sl);}if(!S.cheatRevealed)chkWin();}
function renderBsk(){const c=document.getElementById('basket');c.innerHTML='';S.basket.forEach((lt,idx)=>{if(!lt)return;const el=document.createElement('div');el.className='blt';el.textContent=lt;el.onclick=()=>addFin(lt,idx);c.appendChild(el);});}

function renderTabs(){
  const L=LEVELS[S.level],c=document.getElementById('wTabs');c.innerHTML='';
  for(let i=0;i<L.words.length;i++){
    const tb=document.createElement('div');
    const w=L.words[i];
    if(S.solved[i]){
      tb.className='wtb sv';
      tb.textContent=w.a;
    }else if(i===S.cw){
      tb.className='wtb ac';
      tb.textContent=w.s;
    }else{
      tb.className='wtb unsolved';
      tb.textContent=w.s;
    }
    tb.onclick=()=>{if(!S.solved[i]){S.cw=i;renderTabs();renderWord();}};
    c.appendChild(tb);
  }
}

function renderWord(){const L=LEVELS[S.level],w=L.words[S.cw];const sc=document.getElementById('scrArea'),ac=document.getElementById('ansCells');sc.innerHTML='';ac.innerHTML='';const used=S.ansSt[S.cw].map(x=>x.si);w.s.split('').forEach((ch,idx)=>{const el=document.createElement('div');el.className='sl'+(used.includes(idx)?' us':'');el.textContent=ch;el.onclick=()=>place(S.cw,idx);sc.appendChild(el);});for(let i=0;i<w.a.length;i++){const cl=document.createElement('div');const pl=S.ansSt[S.cw].find(x=>x.p===i);cl.className='acl'+(w.c.includes(i)?' ci':'')+(pl?' fl':'');if(S.solved[S.cw]){cl.textContent=w.a[i];cl.className+=' co';}else if(pl){cl.textContent=w.s[pl.si];cl.onclick=()=>rmLet(S.cw,i);}ac.appendChild(cl);}}

function place(wi,si){if(S.solved[wi]||S.cheatRevealed)return;const st=S.ansSt[wi],w=LEVELS[S.level].words[wi];if(st.length>=w.a.length)return;st.push({p:st.length,si});renderWord();if(st.length===w.a.length)validate(wi);}
function rmLet(wi,pos){if(S.solved[wi]||S.cheatRevealed)return;S.ansSt[wi]=S.ansSt[wi].filter(x=>x.p!==pos).sort((a,b)=>a.p-b.p).map((x,i)=>({...x,p:i}));renderWord();}
function validate(wi){const w=LEVELS[S.level].words[wi];const att=S.ansSt[wi].map(x=>w.s[x.si]).join('');if(att===w.a){S.solved[wi]=true;w.c.forEach(p=>S.basket.push(w.a[p]));renderTabs();renderWord();renderBsk();const nx=S.solved.findIndex((s,i)=>!s&&i>wi);if(nx>=0){S.cw=nx;renderTabs();renderWord();}else{const f=S.solved.findIndex(s=>!s);if(f>=0){S.cw=f;renderTabs();renderWord();}}}else{document.querySelectorAll('.acl').forEach(c=>c.classList.add('wr'));if(navigator.vibrate)navigator.vibrate(100);setTimeout(()=>{document.querySelectorAll('.acl').forEach(c=>c.classList.remove('wr'));S.ansSt[wi]=[];renderWord();},350);}}
function addFin(lt,bi){if(S.cheatRevealed)return;const L=LEVELS[S.level];const ei=S.finAns.findIndex((x,i)=>x===null&&L.final[i]!==' ');if(ei<0)return;S.finAns[ei]=lt;S.basket[bi]=null;renderFin();renderBsk();}
function rmFin(fi){if(S.cheatRevealed)return;const lt=S.finAns[fi];if(!lt)return;S.finAns[fi]=null;S.basket.push(lt);renderFin();renderBsk();}

function chkWin(){
  if(S.cheatRevealed)return;
  const L=LEVELS[S.level];const att=S.finAns.map((x,i)=>x||(L.final[i]===' '?' ':'')).join('');
  if(att===L.final){
    const el=Math.round((Date.now()-S.t0)/1000);S.coins+=25;S.streak++;saveState();
    document.getElementById('vicAns').textContent=L.final;
    document.getElementById('vicSt').innerHTML=`${t('time')}: ${Math.floor(el/60)}:${(el%60).toString().padStart(2,'0')}<br>${t('hintsUsed')}: ${S.hints}<br>+25 💰`;
    document.getElementById('vicOv').classList.add('sh');
  }
}

function confirmCheatAnswer(){
  S.cheatRevealed=false;
  document.getElementById('confirmBar').classList.remove('vis');
  const L=LEVELS[S.level];
  const el=Math.round((Date.now()-S.t0)/1000);S.coins+=25;S.streak++;saveState();
  document.getElementById('vicAns').textContent=L.final;
  document.getElementById('vicSt').innerHTML=`${t('time')}: ${Math.floor(el/60)}:${(el%60).toString().padStart(2,'0')}<br>${t('hintsUsed')}: ${S.hints}<br>+25 💰`;
  document.getElementById('vicOv').classList.add('sh');
}

function nextLevel(){if(S.level<LEVELS.length-1){S.level++;saveState();document.getElementById('vicOv').classList.remove('sh');transitionToLevel(S.level);}else{showErr(t('allDone'));backToMenu();}}

function showHints(){document.getElementById('hintMod').classList.add('sh');}
function closeHints(){document.getElementById('hintMod').classList.remove('sh');}
function useHint(type){
  const costs={letter:50,showWord:100,word:150,final:100};
  if(S.coins<costs[type]){showErr(t('noCoins'));return;}
  S.coins-=costs[type];S.hints++;const L=LEVELS[S.level];
  if(type==='letter'){const w=L.words[S.cw];if(!S.solved[S.cw]){const np=S.ansSt[S.cw].length;if(np<w.a.length){const cl=w.a[np];const used=S.ansSt[S.cw].map(x=>x.si);for(let i=0;i<w.s.length;i++){if(w.s[i]===cl&&!used.includes(i)){S.ansSt[S.cw].push({p:np,si:i});renderWord();if(S.ansSt[S.cw].length===w.a.length)validate(S.cw);break;}}}}}
  else if(type==='showWord'){const w=L.words[S.cw];showErr(`${t('wordTab')} ${S.cw+1}: ${w.a}`);}
  else if(type==='word'){const w=L.words[S.cw];if(!S.solved[S.cw]){const used=new Set();S.ansSt[S.cw]=[];for(let i=0;i<w.a.length-1;i++){for(let j=0;j<w.s.length;j++){if(w.s[j]===w.a[i]&&!used.has(j)){used.add(j);S.ansSt[S.cw].push({p:i,si:j});break;}}}renderWord();}}
  else if(type==='final'){const ei=S.finAns.findIndex((x,i)=>x===null&&L.final[i]!==' ');if(ei>=0){S.finAns[ei]=L.final[ei];renderFin();}}
  document.getElementById('coinDisp').textContent=`${t('coins')} ${S.coins}`;saveState();closeHints();
}

function toggleDebug(){document.getElementById('dbgPan').classList.toggle('sh');}
function cheatShowWordAnswer(){const w=LEVELS[S.level].words[S.cw];showErr(`${t('wordTab')} ${S.cw+1}: ${w.a}`);}
function cheatSolveWordN1(){const L=LEVELS[S.level],w=L.words[S.cw];if(S.solved[S.cw])return;const used=new Set();S.ansSt[S.cw]=[];for(let i=0;i<w.a.length-1;i++){for(let j=0;j<w.s.length;j++){if(w.s[j]===w.a[i]&&!used.has(j)){used.add(j);S.ansSt[S.cw].push({p:i,si:j});break;}}}renderWord();}
function cheatRevealLetter(){const L=LEVELS[S.level];const ei=S.finAns.findIndex((x,i)=>x===null&&L.final[i]!==' ');if(ei>=0){S.finAns[ei]=L.final[ei];renderFin();}}

function cheatShowAnswer(){
  const L=LEVELS[S.level];
  for(let i=0;i<L.final.length;i++){if(L.final[i]!==' ')S.finAns[i]=L.final[i];}
  S.cheatRevealed=true;
  renderFin();
  document.getElementById('confirmBar').classList.add('vis');
}

function cheatSkipLevel(){if(S.level<LEVELS.length-1){S.level++;saveState();transitionToLevel(S.level);}else showErr(t('allDone'));}
function cheatJumpToLevel(){const input=prompt(t('jumpPrompt'),'1');if(!input)return;const n=parseInt(input);if(n>=1&&n<=LEVELS.length){S.level=n-1;saveState();transitionToLevel(n-1);}else showErr('1-'+LEVELS.length+'!');}
function cheatAddCoins(){S.coins+=500;saveState();document.getElementById('coinDisp').textContent=`${t('coins')} ${S.coins}`;showErr('+500 💰');}
function showErr(msg){const e=document.getElementById('errToast');e.textContent=msg;e.classList.add('sh');setTimeout(()=>e.classList.remove('sh'),2500);}

loadState();applyLang();updateMenuProgress();
console.log('[Jumble v2.0] Init complete.');
</script>
