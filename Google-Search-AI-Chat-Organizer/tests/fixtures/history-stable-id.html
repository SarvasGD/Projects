<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Режим ИИ — тестовая страница</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; font: 14px Arial, sans-serif; background: #202124; color: #e8eaed; }
    #left-rail { position: fixed; inset: 0 auto 0 0; width: 261px; padding: 8px; background: #25272c; }
    #history-region { position: absolute; left: 8px; top: 166px; width: 241px; height: 214px; padding: 0; overflow: visible; }
    #history-region button, #history-region a { display: block; width: 241px; height: 40px; line-height: 40px; margin: 0; padding: 0 10px; border: 0; text-align: left; white-space: nowrap; overflow: hidden; color: #e8eaed; background: transparent; text-decoration: none; }
    #history-region button[data-thread-id] { cursor: pointer; }
    #main-content { margin-left: 300px; padding: 60px; min-height: 400px; }
    #main-content [data-message-author-role] { margin: 16px 0; padding: 8px; }
  </style>
</head>
<body>
  <nav id="left-rail" aria-label="Google AI sidebar">
    <div>Google</div>
    <a href="/">Новый чат</a>
    <div role="button">Поиск цепочек</div>
    <div id="history-region">
      <button type="button" role="button">Недавнее</button>
      <button type="button" data-thread-id="thread-101">Многоходовой диалог</button>
      <button type="button" data-thread-id="thread-102">Ещё один диалог</button>
    </div>
  </nav>
  <main id="main-content">
    <div data-thread-id="thread-0" hidden></div>
    <div data-message-author-role="user">Первый вопрос пользователя</div>
    <div data-message-author-role="assistant">Ответ AI на первый вопрос</div>
    <div data-message-author-role="user">Уточняющий вопрос пользователя</div>
    <div data-message-author-role="assistant">Ответ AI на уточнение</div>
  </main>
</body>
</html>
